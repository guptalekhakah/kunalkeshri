<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Kunal Keshri</title>
<meta name="description" content="Full visual gallery — Kunal Keshri, Brand Designer & Multimedia Storyteller.">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300E5FF'/%3E%3Cstop offset='1' stop-color='%23FF2E63'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230A0B0F'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='url(%23g)' stroke-width='4'/%3E%3Cpath d='M27 22 L44 32 L27 42 Z' fill='url(%23g)'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body class="gallery-page">

<!-- Custom pen-tool cursor -->
<div class="cursor-nib" id="cursorNib"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- Top bar -->
<header class="topbar gallery-topbar">
  <a href="index.html" class="logo-mark" aria-label="Kunal Keshri — home">
    <span class="logo-bracket">[</span>KK<span class="logo-bracket">]</span>
  </a>

  <a href="index.html" class="back-link mono">
    <span class="back-arrow">←</span> BACK TO PORTFOLIO
  </a>
</header>

<main class="gallery-main">
  <div class="gallery-heading">
    <p class="eyebrow mono">// FULL GALLERY</p>
    <h1>Frames from the field</h1>
    <p class="section-sub">
      Every frame keeps drifting — click any of them to open it full-size.
    </p>
  </div>

  <!-- gallery.js automatically creates all gallery cards here -->
  <div class="floating-gallery" id="floatingGallery"></div>
</main>

<!-- GALLERY OVERLAY / LIGHTBOX -->
<div class="lightbox gallery-overlay" id="galleryOverlay" aria-hidden="true">
  <div class="lightbox-backdrop" id="galleryOverlayBackdrop"></div>

  <div class="gallery-overlay-panel" role="dialog" aria-modal="true" aria-label="Gallery image viewer">
    <button class="lightbox-close mono" id="galleryOverlayClose" aria-label="Close">
      CLOSE ✕
    </button>

    <button class="lightbox-nav prev" id="galleryOverlayPrev" aria-label="Previous image">
      ‹
    </button>

    <button class="lightbox-nav next" id="galleryOverlayNext" aria-label="Next image">
      ›
    </button>

    <img id="galleryOverlayImg" src="" alt="">

    <span class="gallery-overlay-count mono" id="galleryOverlayCount"></span>
  </div>
</div>

<script src="script.js"></script>
<script src="gallery.js"></script>
</body>
</html>
