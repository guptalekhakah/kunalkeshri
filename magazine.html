<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>SP Enterprises Magazine</title>

    <link rel="stylesheet" href="magazine.css">

    <!-- StPageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>

<body>

    <main class="magazine-page">

        <!-- TOP HEADING -->
        <header class="magazine-header">

            <h1>Our Journey. Our Vision. Our Story.</h1>

            <p>
                Explore the world of SP Enterprises through our journey,
                achievements, partnerships and the landmarks we have created.
            </p>

        </header>


        <!-- MAGAZINE AREA -->
        <section class="magazine-section">

            <div class="magazine-wrapper">

                <div id="book"></div>

            </div>

        </section>


        <!-- SMALL PAGE COUNTER -->
        <div class="page-status">
            <span id="currentPage">1</span>
            <span class="divider">/</span>
            <span id="totalPages">26</span>
        </div>

    </main>


    <script src="magazine.js"></script>

</body>
</html>
